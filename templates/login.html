
{% extends "base.html" %}

{% block title %}Login | UBS Informa{% endblock %}

{% block content %}

<section class="form-card login-card">

    <div style="text-align: center; margin-bottom: 25px;">
        <div class="ubs-icone">✚</div>

        <p class="sobretitulo" style="margin-top: 15px;">
            ÁREA RESTRITA
        </p>

        <h1 style="font-size: 27px;">
            Acesso profissional
        </h1>

        <p class="subtexto">
            Entre com seus dados para gerenciar os avisos da sua UBS.
        </p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="form-grid">

        <div class="campo largo">
            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >
        </div>

        <div class="campo largo">
            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >
        </div>

        <div class="campo largo">
            <button type="submit" class="botao publicar">
                Entrar no painel →
            </button>
        </div>

    </form>
    <div style="text-align: center; margin-top: 20px;">
    <p>É profissional e ainda não tem cadastro?</p>
        <a href="{{ url_for('cadastro_profissional') }}"
   style="color: #80629c; text-decoration: none; font-weight: bold;">
    Cadastre-se aqui
    </a>
    </a>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('inicio') }}"
           style="color: #80629c; text-decoration: none; font-size: 14px;">
            ← Voltar para a página inicial
        </a>
    </div>

</section>

{% endblock %}
