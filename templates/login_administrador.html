
{% extends "base.html" %}

{% block title %}Acesso administrativo | UBS Informa{% endblock %}

{% block content %}

<section class="cabecalho-pagina">
    <p class="sobretitulo">ÁREA RESTRITA</p>
    <h1>Acesso do administrador</h1>
    <p class="subtexto">
        Entre com seu e-mail e senha para administrar o UBS Informa.
    </p>
</section>

<section class="card">
    <form method="POST">

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Digite seu e-mail"
        >

        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
            placeholder="Digite sua senha"
        >

        <button type="submit">Entrar</button>

    </form>
</section>

{% endblock %}
