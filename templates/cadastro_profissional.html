
{% extends "base.html" %}
{% block title %}Cadastro profissional | UBS Informa{% endblock %}

{% block content %}
<section class="form-card login-card">
    <div style="text-align: center; margin-bottom: 25px;">
        <div class="ubs-icone">✚</div>
        <p class="sobretitulo" style="margin-top: 15px;">
            NOVO CADASTRO
        </p>
        <h1 style="font-size: 27px;">Cadastro profissional</h1>
        <p class="subtexto">
            Informe seus dados e selecione sua unidade de saúde.
        </p>
    </div>

    <form method="POST"
          action="{{ url_for('cadastro_profissional') }}"
          class="form-grid">

        <div class="campo largo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo largo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Crie uma senha" minlength="6" required>
        </div>

        <div class="campo largo">
            <label for="id_ubs">Unidade de saúde</label>
            <select id="id_ubs" name="id_ubs" required>
                <option value="">Selecione sua UBS</option>
                {% for unidade in unidades %}
                <option value="{{ unidade.id_ubs }}">
                    {{ unidade.nome }} - {{ unidade.endereco }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo largo">
            <button type="submit" class="botao publicar">
                Criar cadastro →
            </button>
        </div>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('login') }}"
           style="color: #80629c; text-decoration: none;">
            ← Voltar para o login
        </a>
    </div>
</section>
{% endblock %}
